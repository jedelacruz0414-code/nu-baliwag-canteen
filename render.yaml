services:
  - type: web
    name: nu-baliwag-canteen-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://nu-baliwag-canteen.jedelacruz0414.workers.dev
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "12234"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: nu_baliwag_canteen
