.backdrop{position:absolute;inset:0;background:rgba(11,20,35,.4);z-index:20}

.sbody{flex:1;min-height:0;min-width:0;overflow-y:auto;background:var(--bg);padding:14px}

.mut{color:var(--mut);font-size:12.5px}

table{width:100%;border-collapse:collapse;font-size:13px}

.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px}

label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}

.t-ds{background:#e4e7eb;color:#8a94a3}

.modalbg{position:fixed;inset:0;background:rgba(11,20,35,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}

.modalbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.mrow{display:flex;gap:10px;margin-top:16px}

.mrow .btn{width:auto;flex:1}

@media(max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}.side{position:sticky;top:0;z-index:6;height:auto;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;padding:8px}.brand{flex:0 0 auto;padding:0 8px 0 0;margin:0;border:0}.side>button{flex:0 0 auto;width:auto;white-space:nowrap;margin:0;padding:9px 10px}.side>button:last-child{margin-top:0!important}.cols{grid-template-columns:minmax(0,1fr)}}

@media(min-width:900px){

 .student-app .sbody{grid-column:2;grid-row:2;width:min(1320px,100%);justify-self:center;padding:28px 32px}
 .student-app .bnav{grid-column:1;grid-row:2;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 12px;border-top:0;border-right:1px solid var(--line)}
 .student-app .bnav button{flex:none;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:13px}

 .student-app.student-reserve .slot-list{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none}
 .student-app.student-reserve .seatgrid{grid-template-columns:repeat(6,minmax(0,1fr));max-width:680px}
}

async function apiRequest(path, options = {}) {
 const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
 if (apiToken) headers.Authorization = `Bearer ${apiToken}`;
 const response = await fetch(`${API_BASE}${path}`, {
  ...options,
  headers,
  body: options.body && typeof options.body !== "string" ? JSON.stringify(options.body) : options.body
 });
 const payload = await response.json().catch(() => ({}));
 if (!response.ok) throw new Error(payload.error || `API request failed (${response.status}).`);
 return payload;
}
const apiSlotFromMinutes = value => {
 const minutes = Number(value);
 const hour = Math.floor(minutes / 60);
 const minute = minutes % 60;
 return `${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}:00`;
};
const minutesFromApiSlot = value => {
 if (typeof value === "number") return value;
 const parts = String(value || "11:00").split(":").map(Number);
 return (parts[0] || 0) * 60 + (parts[1] || 0);
};
const apiReservationTime = (date, slot) =>

async function attemptLogin(role){

 const adminPw=document.getElementById("admPw")?.value?.trim();

 if(!identity||!password){S.loginError="Please enter your ID/email and password.";r();return;}
 try {
  const result=await apiRequest("/api/auth/login",{method:"POST",body:{identity,password}});
  const user=result.user||{};
  const isAdmin=user.role==="admin";
  if((role==="a"&&!isAdmin)||(role==="s"&&isAdmin)){
   throw new Error("This account does not match the selected login type.");
  }
  apiToken=result.token;
  localStorage.setItem(API_TOKEN_KEY,apiToken);
  if (isAdmin) await loadAdminApiData();
  else await loadApiData(true);
  S.loggedIn=true;
  S.role=isAdmin?"a":"s";
  S.view="home";S.tab="home";S.apage="dash";
  S.loginError="";
  r();
 } catch(error) {
  apiToken="";
  localStorage.removeItem(API_TOKEN_KEY);
  S.loginError=error.message||"Login failed. Please check your credentials.";
  r();
 }
}

  "Custom Date":{s:[["Reservations in range",0],["Food Orders",0],["Revenue",P(0)],["Avg. table usage","—"]],D:[0,0,0,0,0,0,0],p:[0,0,0,0]}};
  const rd=RD[S.repFilter],W=S.repFilter=="This Month"?["Wk 1","Wk 2","Wk 3","Wk 4"]:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].slice(0,rd.D.length),mx=Math.max(1,...rd.D);
  body=`<div class="chips" style="margin-bottom:14px">${["Today","This Week","This Month","Custom Date"].map(c=>`<button class="${S.repFilter==c?'on':''}" onclick="S.repFilter='${c}';r()">${c}</button>`).join("")}</div>
  <div class="stats">${rd.s.map(s=>`<div class="stat"><span class="mut">${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>
  <div class="cols">${card("Daily Reservations",`<div class="chart">${rd.D.map((v,i)=>`<div style="height:${Math.max(4,v/mx*100)}%"><b>${v}</b><span>${W[i]||''}</span></div>`).join("")}</div><div style="height:22px"></div>`)}
  <div>${card("Most Ordered Food",S.menu.slice(0,4).map((m,i)=>`<div style="margin-bottom:11px"><div class="row"><span>${m.n}</span><b class="mut">${rd.p[i]}</b></div><div class="bar"><i style="width:${Math.max(2,rd.p[i]/Math.max(1,rd.p[0])*100)}%"></i></div></div>`).join(""))}
  ${card("Peak Reservation Times",`<table>${[["11:00 – 12:00","Very High"],["12:00 – 13:00","High"],["15:00 – 16:00","Moderate"],["17:00 – 18:00","Low"]].map(x=>`<tr><td>${x[0]}</td><td style="text-align:right"><span class="badge ${x[1]=='Low'?'b-n':x[1]=='Moderate'?'b-o':'b-g'}">${x[1]}</span></td></tr>`).join("")}</table>`)}</div></div>`;}
 else if(p=='users'){const q=(S.resFilter.uq||"").toLowerCase(),rows=S.users.filter(u=>!q||u.n.toLowerCase().includes(q)||u.sid.includes(q));
  body=card("Student Accounts",`<input placeholder="Search student..." style="max-width:300px;margin-bottom:14px" oninput="S.resFilter.uq=this.value;r()">

  ${rows.map(u=>`<tr><td><b>${u.n}</b></td><td class="mut">${u.sid}</td><td class="mut">${u.em}</td><td>${u.res}</td><td>${u.ord}</td>
  <td><span class="badge ${u.active?'b-g':'b-r'}">${u.active?'Active':'Disabled'}</span></td><td style="white-space:nowrap"><button class="btn sm g" style="border-color:var(--line)" onclick='openModal("userview",${JSON.stringify(u)})'>View</button> <button class="btn sm ${u.active?'d':''}" onclick="toggleUser('${u.sid}')">${u.active?'Disable':'Enable'}</button></td></tr>`).join("")}</table>`);}
 else {const s=S.settings;body=`<div class="cols">${card("Cafeteria Information",`<div class="frm"><div><label>Cafeteria name</label><input value="${s.name}" oninput="setField('name',this.value)"></div><div><label>Operating hours</label><input value="${s.hrs}" oninput="setField('hrs',this.value)"></div><div><label>Contact number</label><input value="${s.contact}" oninput="setField('contact',this.value)"></div><div><label>Email</label><input value="${s.email}" oninput="setField('email',this.value)"></div></div>`)}
  ${card("Reservation Settings",`<div class="frm"><div><label>Max reservation duration (mins)</label><input value="${s.maxDur}" oninput="setField('maxDur',this.value)"></div><div><label>Max seats per reservation</label><input value="${s.maxSeats}" oninput="setField('maxSeats',this.value)"></div><div><label>Check-in deadline (mins)</label><input value="${s.ciDeadline}" oninput="setField('ciDeadline',this.value)"></div><div><label>Cancellation window (mins)</label><input value="${s.cancelWin}" oninput="setField('cancelWin',this.value)"></div></div>`)}
  ${card("Table Settings",`<div class="frm"><div><label>Number of tables</label><input value="${s.numTables}" oninput="setField('numTables',this.value)"></div><div><label>Default table capacity</label><input value="${s.cap}" oninput="setField('cap',this.value)"></div><div><label>Locations</label><input value="${s.locs}" oninput="setField('locs',this.value)"></div></div>`)}
  ${card("Ordering Settings",`<div class="frm"><div><label>Pre-ordering</label><select onchange="setField('preorder',this.value)"><option${s.preorder=='Enabled'?' selected':''}>Enabled</option><option${s.preorder=='Disabled'?' selected':''}>Disabled</option></select></div><div><label>Food preparation time (mins)</label><input value="${s.prepTime}" oninput="setField('prepTime',this.value)"></div><div><label>Order cutoff time</label><input value="${s.cutoff}" oninput="setField('cutoff',this.value)"></div></div>`)}
  ${card("Notification Settings",[["notifRes","Reservation alerts"],["notifOrd","Order alerts"],["notifInv","Low inventory alerts"]].map(x=>`<label style="display:flex;gap:9px;align-items:center;margin-bottom:11px;font-size:13.5px;color:var(--txt)"><input type="checkbox" ${s[x[0]]?'checked':''} onchange="setField('${x[0]}',this.checked?1:0)" style="width:auto"> ${x[1]}</label>`).join("")+'<button class="btn" style="margin-top:6px" onclick="saveSettings()">SAVE SETTINGS</button>')}</div>`;}
 return `<div class="adm"><aside class="side"><div class="brand"><div class="crest">NU</div><div><b style="font-size:13.5px">NU BALIWAG CANTEEN</b><div style="font-size:10px;color:#9fb3d1;letter-spacing:.6px">RESERVATION SYSTEM</div></div></div>
  ${NAV.map(n=>`<button class="${p==n[0]?'on':''}" onclick="S.apage='${n[0]}';r()">${n[1]}</button>`).join("")}

   <div style="display:flex;gap:9px;align-items:center"><div class="crest" style="background:var(--navy);color:#fff;width:34px;height:34px;font-size:12px">CO</div><div><b style="font-size:13px">Cafeteria Owner</b><div class="mut" style="font-size:11px">Administrator</div></div></div></div>
   <div class="wrap">${body}</div></div></div>${renderModal()}`;
}
const renderModal=()=>{
 const m=S.modal;if(!m)return"";
 const F=(label,key,type)=>`<div><label>${label}</label><input ${type?`type="${type}"`:''} value="${(m.f[key]??'').toString().replace(/"/g,'&quot;')}" oninput="mset('${key}',this.value)"></div>`;
 let inner="";
 if(m.type=='table'){inner=`<h3>${m.f.isNew?"Add New Table":"Edit Table "+m.f.origN}</h3><div class="frm">${F("Table number","n","number")}${F("Number of seats","seats","number")}${F("Location","loc")}</div>
  <div class="mrow"><button class="btn" onclick="saveTable()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;}
 else if(m.type=='food'){inner=`<h3>${m.f.isNew?"Add Food Item":"Edit "+m.f.n}</h3><div class="frm">${F("Food name","n")}${F("Price (₱)","p","number")}<div><label>Category</label><select onchange="mset('c',this.value)">${MENU_CATEGORIES.filter(c=>c!="All").map(c=>`<option${m.f.c==c?' selected':''}>${c}</option>`).join("")}</select></div>${F("Icon (emoji)","e")}${F("Starting stock","s","number")}${F("Minimum stock level","min","number")}</div>
  <div class="mrow"><button class="btn" onclick="saveFood()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;}
 else if(m.type=='stock'){inner=`<h3>Update Stock — ${m.f.n}</h3><div class="frm">${F("Current stock","s","number")}${F("Minimum stock level","min","number")}</div>
  <div class="mrow"><button class="btn" onclick="saveStock()">Save</button><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Cancel</button></div>`;}
 else if(m.type=='resview'){const x=m.f,status=reservationStatus(x);inner=`<h3>Reservation ${x.id}</h3>
  ${[["Student",x.n],["School ID",x.sid],["Table",x.t],["Seats",x.s],["Date",x.date?formatReservationDate(x.date):"—"],["Time",x.slot?reservationSlotLabel(x.slot):x.tm],["Check-in",x.ci],["Status",status]].map(r=>`<div class="row" style="margin-bottom:10px"><span class="mut">${r[0]}</span><b>${r[1]}</b></div>`).join("")}
  <div class="mrow"><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Close</button></div>`;}
 else if(m.type=='userview'){const u=m.f;inner=`<h3>${u.n}</h3>
  ${[["School ID",u.sid],["Email",u.em],["Reservations",u.res],["Orders",u.ord],["Status",u.active?"Active":"Disabled"]].map(r=>`<div class="row" style="margin-bottom:10px"><span class="mut">${r[0]}</span><b>${r[1]}</b></div>`).join("")}
  <div class="mrow"><button class="btn g" style="border-color:var(--line)" onclick="closeModal()">Close</button></div>`;}
 return `<div class="modalbg" onclick="if(event.target==this)closeModal()"><div class="modalbox">${inner}</div></div>`;
};
function r(preserveScroll=false){
 const previousBody=S.role=='s'&&preserveScroll?document.querySelector('.sbody'):null;
 const previousSlotList=previousBody?.querySelector('.slot-list');
 const scrollTop=previousBody?previousBody.scrollTop:0;
 const slotListScrollTop=previousSlotList?previousSlotList.scrollTop:0;
 saveDB();
 document.getElementById("app").innerHTML=!S.loggedIn?landing():(S.role=='s'?student():admin());
 if(previousBody){const nextBody=document.querySelector('.sbody');if(nextBody)requestAnimationFrame(()=>{nextBody.scrollTop=scrollTop;const nextSlotList=nextBody.querySelector('.slot-list');if(nextSlotList)nextSlotList.scrollTop=slotListScrollTop})}
}

 if(S.left==0)finishDiningTimer()},1000);
if(new URLSearchParams(location.search).has('admin')){S.role='a';}
r();
